[package]
name = "chat-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
dashmap = "6"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "zstd"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
